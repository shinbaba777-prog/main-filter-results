name: 4406 FCF nonrecurring sensitivity (review only)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/source-provenance-report-20261028
    paths:
      - scripts/review_4406_cf_sensitivity.py
      - tests/test_review_4406_cf_sensitivity.py
      - .github/workflows/4406-cf-sensitivity-review.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -p 'test_review_4406_cf_sensitivity.py' -v
      - name: Reconcile five-year source data
        run: python3 scripts/verify_4406_primary_sources.py
      - name: Generate review-only FCF sensitivity
        run: python3 scripts/review_4406_cf_sensitivity.py
      - uses: actions/upload-artifact@v4
        with:
          name: 4406-fcf-sensitivity-review
          path: artifacts/4406_cf_sensitivity_review.json
          retention-days: 14
