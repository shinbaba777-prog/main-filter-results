name: 4406 XBRL prioritized review groups (no scoring)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/source-provenance-report-20261028
    paths:
      - scripts/prioritize_4406_xbrl_review.py
      - tests/test_prioritize_4406_xbrl_review.py
      - .github/workflows/4406-xbrl-priority-review.yml
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test review prioritization
        run: python3 -m unittest discover -s tests -p 'test_prioritize_4406_xbrl_review.py' -v
      - name: Build review-only priority groups
        run: python3 scripts/prioritize_4406_xbrl_review.py
      - uses: actions/upload-artifact@v4
        with:
          name: 4406-xbrl-priority-review
          path: artifacts/4406_xbrl_priority_review.json
          retention-days: 14
