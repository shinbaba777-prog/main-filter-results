name: Test 4406 verification gate (isolated)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/source-provenance-report-20261028
    paths:
      - tests/test_verify_4406_primary_sources.py
      - scripts/verify_4406_primary_sources.py
      - .github/workflows/test-4406-verification-gate.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run fail-closed gate regression tests
        run: python3 -m unittest discover -s tests -p 'test_verify_4406_primary_sources.py' -v
      - name: Verify real five-year data (review-only)
        run: python3 scripts/verify_4406_primary_sources.py
