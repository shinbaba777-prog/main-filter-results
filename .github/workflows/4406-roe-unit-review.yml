name: 4406 ROE XBRL unit verification (review only)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/source-provenance-report-20261028
    paths:
      - scripts/review_4406_roe_units.py
      - tests/test_review_4406_roe_units.py
      - .github/workflows/4406-roe-unit-review.yml
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test ROE unit review
        run: python3 -m unittest discover -s tests -p 'test_review_4406_roe_units.py' -v
      - name: Check official financial reference
        run: python3 scripts/verify_4406_primary_sources.py
      - name: Review five ROE ratios
        run: python3 scripts/review_4406_roe_units.py
      - uses: actions/upload-artifact@v4
        with:
          name: 4406-roe-unit-review
          path: artifacts/4406_roe_unit_review.json
          retention-days: 14
