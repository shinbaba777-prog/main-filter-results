name: 4406 scoring bridge dry run (no publishing)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/source-provenance-report-20261028
    paths:
      - scripts/bridge_4406_review_to_scoring.py
      - tests/test_4406_scoring_bridge.py
      - .github/workflows/4406-scoring-bridge-dry-run.yml
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test bridge fail-closed invariants
        run: python3 -m unittest discover -s tests -p 'test_4406_scoring_bridge.py' -v
      - name: Verify source values
        run: python3 scripts/verify_4406_primary_sources.py
      - name: Build evidence inventory
        run: python3 scripts/build_4406_evidence_inventory.py
      - name: Dry-run existing scoring engine without approving any metric
        run: python3 -m scripts.bridge_4406_review_to_scoring
      - name: Upload dry-run evidence
        uses: actions/upload-artifact@v4
        with:
          name: 4406-scoring-bridge-dry-run
          path: |
            artifacts/4406_evidence_inventory.json
            artifacts/4406_scoring_bridge_dry_run.json
          retention-days: 14
