name: EDINET API data refresh

on:
  workflow_dispatch:
    inputs:
      securities_code:
        description: "Optional Japanese securities code (e.g. 4406)"
        required: false
        default: ""
        type: string
      download_csv:
        description: "Download annual-report XBRL CSV ZIPs for the code"
        required: false
        default: false
        type: boolean
      download_history:
        description: "Scan up to 5 years and download annual reports for 5 fiscal periods"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "35 16 * * *" # 01:35 JST daily
  push:
    paths:
      - ".github/workflows/edinet-api.yml"
      - "scripts/**"
      - "tests/**"

permissions:
  contents: write

concurrency:
  group: edinet-api-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Compile Python scripts and run offline tests
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v

      - name: Fetch EDINET filing metadata
        id: fetch
        continue-on-error: true
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          SECURITIES_CODE: ${{ inputs.securities_code }}
          DOWNLOAD_CSV: ${{ inputs.download_csv }}
          DOWNLOAD_HISTORY: ${{ inputs.download_history }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          ARGS="--days 14"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DOWNLOAD_HISTORY" = "true" ]; then
            ARGS="--days 180 --download-csv --history-years 5"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DOWNLOAD_CSV" = "true" ]; then
            ARGS="--days 180 --download-csv"
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$SECURITIES_CODE" ]; then
            ARGS="$ARGS --code $SECURITIES_CODE"
          fi
          python scripts/fetch_edinet.py $ARGS

      - name: Extract XBRL CSV values for review
        id: extract
        if: ${{ steps.fetch.outcome == 'success' && (inputs.download_csv || inputs.download_history) }}
        run: python scripts/parse_edinet_csv.py

      - name: Validate candidate metadata for manual review
        if: ${{ steps.fetch.outcome == 'success' && (inputs.download_csv || inputs.download_history) }}
        run: python scripts/validate_edinet_candidates.py

      - name: Build core metric review queue
        if: ${{ steps.fetch.outcome == 'success' && (inputs.download_csv || inputs.download_history) }}
        run: python scripts/build_edinet_core_metric_review.py

      - name: Commit refreshed EDINET data
        if: ${{ always() }}
        run: |
          # Preserve previously extracted/reviewed data if the latest metadata fetch fails.
          # A failed refresh must never delete the existing review queue.
          if [ -f data/edinet/download_manifest.json ]; then
            python -c 'import json; from pathlib import Path; m=json.loads(Path("data/edinet/download_manifest.json").read_text(encoding="utf-8")); print("## EDINET download manifest"); print("| Period end | Document ID | Status | Reason |"); print("|---|---|---|---|"); [print("| " + str(x.get("periodEnd","")) + " | " + str(x.get("docID","")) + " | " + str(x.get("status","")) + " | " + str(x.get("reason","")) + " |") for x in m.get("periods",[])]; print(); print("**Overall status:** " + str(m.get("status","unknown"))); print("**Gaps:** " + json.dumps(m.get("gaps",[]), ensure_ascii=False))' >> "$GITHUB_STEP_SUMMARY"
          fi
          git add data/edinet
          if git diff --cached --quiet; then
            echo "No EDINET data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh EDINET data and core metric review queue"
          # Another workflow or collaborator may update main while EDINET is running.
          # Rebase our generated data commit onto the latest main before pushing.
          git fetch origin main
          git rebase origin/main
          git push

      - name: Fail workflow if EDINET fetch or extraction was incomplete
        if: ${{ always() && (steps.fetch.outcome != 'success' || ((inputs.download_csv || inputs.download_history) && steps.extract.outcome == 'failure')) }}
        run: |
          echo "EDINET fetch or extraction was incomplete. See download_manifest.json and the job summary."
          exit 1
