name: 4406 XBRL consolidation scope audit (review only)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/source-provenance-report-20261028
    paths:
      - scripts/review_4406_consolidation_scope.py
      - tests/test_review_4406_consolidation_scope.py
      - .github/workflows/4406-consolidation-scope-review.yml
permissions:
  contents: read
jobs:
  scope-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test scope safety
        run: python3 -m unittest discover -s tests -p 'test_review_4406_consolidation_scope.py' -v
      - name: Check official reference
        run: python3 scripts/verify_4406_primary_sources.py
      - name: Compare current-year values
        run: python3 scripts/reconcile_4406_xbrl_current_year.py
      - name: Review ROE units
        run: python3 scripts/review_4406_roe_units.py
      - name: Inventory unresolved scope
        run: python3 scripts/review_4406_consolidation_scope.py
      - uses: actions/upload-artifact@v4
        with:
          name: 4406-consolidation-scope-review
          path: artifacts/4406_consolidation_scope_review.json
          retention-days: 14
