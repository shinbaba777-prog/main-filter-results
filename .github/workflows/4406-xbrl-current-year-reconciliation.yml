name: 4406 XBRL current-year official reference comparison (review only)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/source-provenance-report-20261028
    paths:
      - scripts/reconcile_4406_xbrl_current_year.py
      - tests/test_reconcile_4406_xbrl_current_year.py
      - .github/workflows/4406-xbrl-current-year-reconciliation.yml
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test fail-closed XBRL comparison
        run: python3 -m unittest discover -s tests -p 'test_reconcile_4406_xbrl_current_year.py' -v
      - name: Verify official reference
        run: python3 scripts/verify_4406_primary_sources.py
      - name: Compare current-year candidate values
        run: python3 scripts/reconcile_4406_xbrl_current_year.py
      - uses: actions/upload-artifact@v4
        with:
          name: 4406-xbrl-current-year-review
          path: artifacts/4406_xbrl_current_year_matches.json
          retention-days: 14
