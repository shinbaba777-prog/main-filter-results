name: EDINET context diagnostics checks

on:
  pull_request:
    paths:
      - "scripts/check_edinet_row_context.py"
      - "tests/test_check_edinet_row_context.py"
      - ".github/workflows/edinet-context-pr-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-context:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run context unit tests
        run: python3 -m unittest discover -s tests -p 'test_check_edinet_row_context.py' -v
      - name: Inspect EDINET context without writing data
        run: python3 scripts/check_edinet_row_context.py
