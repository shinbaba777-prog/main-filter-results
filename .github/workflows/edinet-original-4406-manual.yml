name: EDINET 4406 original XBRL manual evidence

on:
  workflow_dispatch:
    inputs:
      confirm_fetch:
        description: "Fetch 4406 original XBRL for five filings (requires EDINET_API_KEY)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fetch-evidence:
    if: ${{ inputs.confirm_fetch }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download original XBRL and extract context evidence
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/edinet-4406-contexts"
          python3 - <<'PY'
          import io, json, os, sys, time, urllib.parse, urllib.request, zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path

          docs = ["S100OK43", "S100R83V", "S100TUAP", "S100W17N", "S100YGXD"]
          output = Path(os.environ["RUNNER_TEMP"]) / "edinet-4406-contexts"
          key = os.environ.get("EDINET_API_KEY", "").strip()
          if not key:
              print("BLOCKED: EDINET_API_KEY secret is missing")
              sys.exit(2)
          ns = "{http://www.xbrl.org/2003/instance}"
          dim_ns = "{http://xbrl.org/2006/xbrldi}"
          report = []
          for doc_id in docs:
              item = {"docID": doc_id, "status": "BLOCKED"}
              try:
                  url = ("https://api.edinet-fsa.go.jp/api/v2/documents/" + doc_id
                         + "?" + urllib.parse.urlencode({"type": "1", "Subscription-Key": key}))
                  # Never print URL, HTTP exception text or response bodies: key may be present.
                  request = urllib.request.Request(url, headers={"Accept": "application/zip"})
                  with urllib.request.urlopen(request, timeout=35) as response:
                      payload = response.read(80 * 1024 * 1024 + 1)
                  if len(payload) > 80 * 1024 * 1024 or not zipfile.is_zipfile(io.BytesIO(payload)):
                      raise ValueError("invalid ZIP")
                  instances = {}
                  with zipfile.ZipFile(io.BytesIO(payload)) as zf:
                      for entry in zf.infolist():
                          if not entry.filename.lower().endswith((".xbrl", ".xml")):
                              continue
                          if entry.file_size > 15 * 1024 * 1024:
                              continue
                          try:
                              root = ET.fromstring(zf.read(entry))
                              if root.tag != ns + "xbrl":
                                  continue
                              contexts = {}
                              for ctx in root.iter(ns + "context"):
                                  cid = ctx.get("id")
                                  period = ctx.find(ns + "period")
                                  if not cid or period is None:
                                      continue
                                  dims = [{"dimension": el.get("dimension", ""),
                                           "member": "".join(el.itertext()).strip()}
                                          for el in ctx.iter()
                                          if el.tag in (dim_ns + "explicitMember", dim_ns + "typedMember")]
                                  contexts[cid] = {
                                      "start_date": period.findtext(ns + "startDate"),
                                      "end_date": period.findtext(ns + "endDate"),
                                      "instant": period.findtext(ns + "instant"),
                                      "dimensions": dims}
                              if contexts:
                                  instances[entry.filename] = contexts
                          except (ET.ParseError, ValueError, zipfile.BadZipFile):
                              continue
                  if not instances:
                      raise ValueError("no original XBRL instance contexts")
                  (output / (doc_id + ".contexts.json")).write_text(
                      json.dumps(instances, ensure_ascii=False, indent=2), encoding="utf-8")
                  item = {"docID": doc_id, "status": "CONTEXTS_FOUND",
                          "instances": len(instances),
                          "contexts": sum(len(x) for x in instances.values())}
              except Exception as exc:
                  item["error_type"] = type(exc).__name__
              report.append(item)
              print(json.dumps(item, ensure_ascii=False), flush=True)
              time.sleep(0.3)
          (output / "fetch_report.json").write_text(
              json.dumps({"scoring_ready": False, "filings": report}, indent=2),
              encoding="utf-8")
          if not all(item["status"] == "CONTEXTS_FOUND" for item in report):
              sys.exit(2)
          PY
      - name: Upload temporary evidence, even if incomplete
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: edinet-4406-original-contexts-${{ github.run_id }}
          path: ${{ runner.temp }}/edinet-4406-contexts/
          if-no-files-found: warn
          retention-days: 7
