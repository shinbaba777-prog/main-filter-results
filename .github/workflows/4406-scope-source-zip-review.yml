name: 4406 XBRL source ZIP scope evidence (review only)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/source-provenance-report-20261028
    paths:
      - scripts/inspect_4406_scope_source_zips.py
      - tests/test_inspect_4406_scope_source_zips.py
      - .github/workflows/4406-scope-source-zip-review.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test source ZIP provenance
        run: python3 -m unittest discover -s tests -p 'test_inspect_4406_scope_source_zips.py' -v
      - name: Verify official reference
        run: python3 scripts/verify_4406_primary_sources.py
      - name: Reconcile current-year XBRL
        run: python3 scripts/reconcile_4406_xbrl_current_year.py
      - name: Check ROE units
        run: python3 scripts/review_4406_roe_units.py
      - name: Enumerate unresolved scope
        run: python3 scripts/review_4406_consolidation_scope.py
      - name: Inspect EDINET source ZIP provenance
        run: python3 scripts/inspect_4406_scope_source_zips.py
      - uses: actions/upload-artifact@v4
        with:
          name: 4406-scope-source-zip-review
          path: artifacts/4406_scope_source_zip_evidence.json
          retention-days: 14
