name: EDINET original evidence integration checks

on:
  pull_request:
    paths:
      - "scripts/check_original_xbrl_contexts.py"
      - "scripts/fetch_original_edinet_context_evidence.py"
      - "tests/test_original_xbrl_evidence_integration.py"
      - "scripts/verify_edinet_actual_periods.py"
      - "tests/test_verify_edinet_actual_periods.py"
      - ".github/workflows/edinet-original-evidence-integration.yml"
  workflow_dispatch:
    inputs:
      fetch_originals:
        description: "Opt in to fetching original XBRL from EDINET"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check requests
      - name: Run integration tests
        run: |
          python3 -m unittest discover -s tests -p 'test_original_xbrl_evidence_integration.py' -v
          python3 -m unittest discover -s tests -p 'test_verify_edinet_actual_periods.py' -v
      - name: Fetch and check original contexts only on explicit opt-in
        id: fetch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.fetch_originals }}
        continue-on-error: true
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: python3 scripts/fetch_original_edinet_context_evidence.py --output-dir "$RUNNER_TEMP/edinet-context-evidence" --check-audit
      - name: Verify actual original-XBRL period dates
        id: periods
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.fetch_originals }}
        continue-on-error: true
        run: python3 scripts/verify_edinet_actual_periods.py --evidence-dir "$RUNNER_TEMP/edinet-context-evidence"
      - name: Upload temporary context evidence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.fetch_originals }}
        uses: actions/upload-artifact@v4
        with:
          name: edinet-original-context-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/edinet-context-evidence/*.contexts.json
          if-no-files-found: warn
          retention-days: 7
      - name: Fail if original evidence check did not pass
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.fetch_originals && (steps.fetch.outcome != 'success' || steps.periods.outcome != 'success') }}
        run: exit 1
